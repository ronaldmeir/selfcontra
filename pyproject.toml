[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ronaldmeir-selfcontra"
version = "0.1.0"
description = "在同一输出内比对陈述对，标出互相矛盾的两句并给出双方原文"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ronaldmeir" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ronaldmeir.github.io"
Repository = "https://github.com/ronaldmeir/selfcontra"
Issues = "https://github.com/ronaldmeir/selfcontra/issues"

[project.scripts]
selfcontra = "selfcontra:main"

[tool.setuptools]
py-modules = ["selfcontra"]
